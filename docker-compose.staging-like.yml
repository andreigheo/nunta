name: weddingos-staging-like

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: weddingos_staging
      POSTGRES_USER: weddingos
      POSTGRES_PASSWORD: staging-only-database-secret
    volumes:
      - staging-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-staging-role.sql:/docker-entrypoint-initdb.d/010-init-staging-role.sql:ro
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddingos -d weddingos_staging"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "staging-redis-secret",
      ]
    volumes: [staging-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "staging-redis-secret", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: staging-source
      MINIO_ROOT_PASSWORD: staging-source-storage-secret
    volumes: [staging-storage:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      storage: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set source http://storage:9000 staging-source staging-source-storage-secret &&
        mc mb --ignore-existing source/weddingos-staging-private &&
        mc anonymous set none source/weddingos-staging-private
  backup-destination:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/backup"]
    environment:
      MINIO_ROOT_USER: staging-backup
      MINIO_ROOT_PASSWORD: staging-independent-backup-secret
    volumes: [staging-backup:/backup]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
  backup-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      backup-destination: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set backup http://backup-destination:9000 staging-backup staging-independent-backup-secret &&
        mc mb --ignore-existing backup/weddingos-staging-backups &&
        mc anonymous set none backup/weddingos-staging-backups
  restore-destination:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/restore"]
    environment:
      MINIO_ROOT_USER: staging-restore
      MINIO_ROOT_PASSWORD: staging-isolated-restore-secret
    volumes: [staging-restore:/restore]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
  restore-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      restore-destination: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set restore http://restore-destination:9000 staging-restore staging-isolated-restore-secret &&
        mc mb --ignore-existing restore/weddingos-staging-restore &&
        mc anonymous set none restore/weddingos-staging-restore
  mail:
    image: axllent/mailpit:v1.27
  clamav:
    image: clamav/clamav:1.5.3
    volumes: [staging-clamav:/var/lib/clamav]
  api:
    image: weddingos-api:${WEDDINGOS_RELEASE_ID:-current}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        WEDDINGOS_BUILD_ID: ${WEDDINGOS_RELEASE_ID:-current}
    environment: &api-environment
      NODE_ENV: staging
      DATABASE_PURPOSE: staging
      WEB_URL: https://weddingos.localhost
      API_URL: https://weddingos.localhost/api
      PORT: 4000
      BIND_HOST: 0.0.0.0
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgresql://weddingos_app:staging-app-role-secret@postgres:5432/weddingos_staging?schema=public
      SESSION_SECRET: staging-like-session-secret-change-before-external-use
      SESSION_COOKIE_NAME: weddingos_staging_session
      EMAIL_FROM: WeddingOS Staging <no-reply@weddingos.local>
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mail
      SMTP_PORT: 1025
      REDIS_URL: redis://:staging-redis-secret@redis:6379
      OUTBOX_ENCRYPTION_KEY: staging-like-outbox-key-change-before-external-use
      OUTBOX_ENCRYPTION_KEY_ID: staging-v1
      COPILOT_EXTERNAL_ENABLED: ${COPILOT_EXTERNAL_ENABLED:-false}
      COPILOT_EXTERNAL_DATA_ALLOWED: ${COPILOT_EXTERNAL_DATA_ALLOWED:-false}
      COPILOT_PROVIDER_PROTOCOL: ${COPILOT_PROVIDER_PROTOCOL:-openrouter-chat}
      COPILOT_PROVIDER_ENDPOINT: ${COPILOT_PROVIDER_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
      COPILOT_PROVIDER_API_KEY: ${COPILOT_PROVIDER_API_KEY:-}
      COPILOT_PROVIDER_MODEL: ${COPILOT_PROVIDER_MODEL:-openai/gpt-5.6-luna}
      COPILOT_MAX_CONTEXT_BYTES: ${COPILOT_MAX_CONTEXT_BYTES:-64000}
      COPILOT_DAILY_COST_LIMIT_MINOR: ${COPILOT_DAILY_COST_LIMIT_MINOR:-500}
      COPILOT_MAX_RUN_COST_MINOR: ${COPILOT_MAX_RUN_COST_MINOR:-25}
      COPILOT_INPUT_COST_MINOR_PER_MILLION: ${COPILOT_INPUT_COST_MINOR_PER_MILLION:-10}
      COPILOT_OUTPUT_COST_MINOR_PER_MILLION: ${COPILOT_OUTPUT_COST_MINOR_PER_MILLION:-60}
      COPILOT_WEB_SEARCH_COST_MINOR: ${COPILOT_WEB_SEARCH_COST_MINOR:-1}
      COPILOT_EMBEDDING_ENABLED: ${COPILOT_EMBEDDING_ENABLED:-false}
      COPILOT_EMBEDDING_ENDPOINT: ${COPILOT_EMBEDDING_ENDPOINT:-https://api.openai.com/v1/embeddings}
      COPILOT_EMBEDDING_API_KEY: ${COPILOT_EMBEDDING_API_KEY:-}
      COPILOT_EMBEDDING_MODEL: ${COPILOT_EMBEDDING_MODEL:-text-embedding-3-small}
      LOG_LEVEL: info
      FEATURE_MAGIC_LINK_ENABLED: "true"
      FEATURE_MFA_ENABLED: "true"
      CSRF_ENFORCEMENT: "true"
      MFA_ENCRYPTION_KEY: staging-like-mfa-key-change-before-external-use
      MFA_ENCRYPTION_KEY_ID: staging-mfa-v1
      OBJECT_STORAGE_PROVIDER: minio
      OBJECT_STORAGE_ENDPOINT: http://storage:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: https://weddingos.localhost/storage
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: weddingos-staging-private
      OBJECT_STORAGE_ACCESS_KEY: staging-source
      OBJECT_STORAGE_SECRET_KEY: staging-source-storage-secret
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      METRICS_TOKEN: staging-like-metrics-token
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: weddingos-api-staging-like
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      mail: { condition: service_started }
      clamav: { condition: service_started }
      otel-collector: { condition: service_started }
  worker:
    image: weddingos-worker:${WEDDINGOS_RELEASE_ID:-current}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        WEDDINGOS_BUILD_ID: ${WEDDINGOS_RELEASE_ID:-current}
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://weddingos_worker:staging-worker-role-secret@postgres:5432/weddingos_staging?schema=public
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      clamav: { condition: service_started }
      otel-collector: { condition: service_started }
  web:
    image: weddingos-web:${WEDDINGOS_RELEASE_ID:-current}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WEDDINGOS_BUILD_ID: ${WEDDINGOS_RELEASE_ID:-current}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_PATH: /api/v1
      SESSION_COOKIE_NAME: weddingos_staging_session
    depends_on: [api]
  proxy:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:58443:443"
      - "127.0.0.1:58080:80"
    volumes:
      - ./ops/caddy/Caddyfile.staging-like:/etc/caddy/Caddyfile:ro
      - staging-caddy-data:/data
    depends_on: [web, api]
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:58686:16686"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./ops/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on: [jaeger]
  prometheus:
    image: prom/prometheus:v3.3.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/observability/prometheus.staging-like.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:59094:9090"
    depends_on: [api, alertmanager]
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:53000:3000"
    depends_on: [prometheus]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./ops/observability/alertmanager.staging-like.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:59095:9093"
    depends_on: [alert-receiver]
  alert-receiver:
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: 8080
    ports:
      - "127.0.0.1:59096:8080"

volumes:
  staging-postgres:
  staging-redis:
  staging-storage:
  staging-backup:
  staging-restore:
  staging-clamav:
  staging-caddy-data:
