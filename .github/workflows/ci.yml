name: Sarbato CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres mailpit redis minio clamav
      - name: Migrate and seed PostgreSQL
        env:
          DATABASE_URL: postgresql://weddingos:weddingos@127.0.0.1:54339/weddingos?schema=public
          DATABASE_OWNER_URL: postgresql://weddingos:weddingos@127.0.0.1:54339/weddingos?schema=public
        run: |
          pnpm db:migrate
          pnpm --filter @weddingos/contracts build
          pnpm --filter @weddingos/config build
          pnpm --filter @weddingos/jobs build
          pnpm db:generate
          pnpm --filter @weddingos/database build
          pnpm db:seed
          pnpm --filter @weddingos/database exec prisma migrate status --schema prisma/schema.prisma
      - name: Prepare isolated integration database
        run: pnpm db:test:prepare:integration
      - name: Verify Slice 0/1/2A
        run: pnpm verify
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm test:e2e
      - name: Reject skipped or retried E2E
        run: node scripts/verify-playwright-hard-gate.mjs
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dependency vulnerability gate
        run: pnpm audit --audit-level high
      - name: License inventory
        run: pnpm licenses list --json > license-inventory.json
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          path: .
          format: spdx-json
          output-file: weddingos.spdx.json
      - name: Artifact checksums
        run: sha256sum pnpm-lock.yaml weddingos.spdx.json license-inventory.json > supply-chain.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            weddingos.spdx.json
            license-inventory.json
            supply-chain.sha256

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
