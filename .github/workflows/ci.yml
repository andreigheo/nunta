name: Sarbato CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres mailpit redis minio clamav jaeger otel-collector
      - name: Migrate and seed PostgreSQL
        env:
          DATABASE_URL: postgresql://weddingos:weddingos@127.0.0.1:54339/weddingos?schema=public
          DATABASE_OWNER_URL: postgresql://weddingos:weddingos@127.0.0.1:54339/weddingos?schema=public
        run: |
          pnpm db:migrate
          pnpm --filter @weddingos/contracts build
          pnpm --filter @weddingos/config build
          pnpm --filter @weddingos/jobs build
          pnpm db:generate
          pnpm --filter @weddingos/database build
          pnpm db:seed
          pnpm --filter @weddingos/database exec prisma migrate status --schema prisma/schema.prisma
      - name: Prepare isolated integration database
        run: pnpm db:test:prepare:integration
      - name: Verify Slice 0/1/2A
        run: pnpm verify
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm test:e2e
      - name: Reject skipped or retried E2E
        run: node scripts/verify-playwright-hard-gate.mjs
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dependency vulnerability gate
        run: pnpm audit --audit-level high
      - name: License inventory
        run: pnpm licenses list --json > license-inventory.json
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: weddingos.spdx.json
      - name: Artifact checksums
        run: sha256sum pnpm-lock.yaml weddingos.spdx.json license-inventory.json > supply-chain.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence
          path: |
            weddingos.spdx.json
            license-inventory.json
            supply-chain.sha256

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
