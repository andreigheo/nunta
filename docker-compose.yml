services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: weddingos
      POSTGRES_USER: weddingos
      POSTGRES_PASSWORD: weddingos
    ports:
      - "127.0.0.1:54339:5432"
    volumes:
      - weddingos-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/010-init-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddingos -d weddingos"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - weddingos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: weddingos
      MINIO_ROOT_PASSWORD: weddingos-local-storage-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - weddingos-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 weddingos weddingos-local-storage-secret &&
        mc mb --ignore-existing local/weddingos-private &&
        mc mb --ignore-existing local/weddingos-integration &&
        mc mb --ignore-existing local/weddingos-e2e &&
        mc anonymous set none local/weddingos-private &&
        mc anonymous set none local/weddingos-integration &&
        mc anonymous set none local/weddingos-e2e

  minio-backup:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/backup"]
    environment:
      MINIO_ROOT_USER: weddingos-backup
      MINIO_ROOT_PASSWORD: weddingos-independent-backup-secret
    ports:
      - "127.0.0.1:59100:9000"
    volumes:
      - weddingos-minio-backup:/backup
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-restore:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/restore"]
    environment:
      MINIO_ROOT_USER: weddingos-restore
      MINIO_ROOT_PASSWORD: weddingos-isolated-restore-secret
    ports:
      - "127.0.0.1:59200:9000"
    volumes:
      - weddingos-minio-restore:/restore
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  clamav:
    image: clamav/clamav:1.5.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:53310:3310"
    volumes:
      - weddingos-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./ops/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      jaeger:
        condition: service_healthy

  alert-webhook:
    image: mendhak/http-https-echo:35
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
    ports:
      - "127.0.0.1:59090:8080"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/alertmanager/alertmanager.yml",
        "--storage.path=/alertmanager",
      ]
    volumes:
      - ./ops/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - weddingos-alertmanager:/alertmanager
    ports:
      - "127.0.0.1:59093:9093"
    depends_on:
      - alert-webhook

  prometheus:
    image: prom/prometheus:v3.3.0
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--web.listen-address=127.0.0.1:59092",
      ]
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - weddingos-prometheus:/prometheus
    network_mode: host
    depends_on:
      - alertmanager

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      WEB_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:4000
      PORT: 4000
      DATABASE_URL: postgresql://weddingos_app:weddingos_app@postgres:5432/weddingos?schema=public
      DATABASE_OWNER_URL: postgresql://weddingos:weddingos@postgres:5432/weddingos?schema=public
      SESSION_SECRET: local-compose-session-secret-change-in-production
      SESSION_COOKIE_NAME: weddingos_session
      EMAIL_FROM: WeddingOS <no-reply@weddingos.local>
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      REDIS_URL: redis://redis:6379
      OUTBOX_ENCRYPTION_KEY: local-compose-outbox-encryption-key-change-production
      WORKER_STALE_AFTER_SECONDS: 45
      COPILOT_EXTERNAL_ENABLED: "false"
      COPILOT_EXTERNAL_DATA_ALLOWED: "false"
      COPILOT_PROVIDER_PROTOCOL: openrouter-chat
      COPILOT_PROVIDER_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
      COPILOT_PROVIDER_MODEL: openai/gpt-5.6-luna
      COPILOT_MAX_CONTEXT_BYTES: 64000
      COPILOT_DAILY_COST_LIMIT_MINOR: 500
      COPILOT_MAX_RUN_COST_MINOR: 25
      COPILOT_INPUT_COST_MINOR_PER_MILLION: 10
      COPILOT_OUTPUT_COST_MINOR_PER_MILLION: 60
      COPILOT_WEB_SEARCH_COST_MINOR: 1
      COPILOT_EMBEDDING_ENABLED: "false"
      COPILOT_EMBEDDING_ENDPOINT: https://api.openai.com/v1/embeddings
      COPILOT_EMBEDDING_MODEL: text-embedding-3-small
      MARKETING_SNAPSHOT_INTERVAL_SECONDS: 900
      MARKETING_SNAPSHOT_WINDOW_DAYS: 365
      MARKETING_SNAPSHOT_MIN_COHORT: 20
      MARKETING_SNAPSHOT_MAX_STALE_SECONDS: 86400
      LOG_LEVEL: info
      FEATURE_MAGIC_LINK_ENABLED: "true"
      FEATURE_MFA_ENABLED: "false"
      SUBSCRIPTION_PROVIDER: fake
      SUBSCRIPTION_PROVIDER_SECRET: local-compose-subscription-webhook-secret
      PAYOUT_PROVIDER: fake
      PAYOUT_PROVIDER_SECRET: local-compose-payout-webhook-secret
      REVIEW_EDIT_WINDOW_DAYS: 30
      SUBSCRIPTION_GRACE_PERIOD_DAYS: 7
      PAYOUT_HOLD_DAYS: 7
      PAYOUT_MINIMUM_MINOR: 10000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  weddingos-postgres:
  weddingos-redis:
  weddingos-minio:
  weddingos-minio-backup:
  weddingos-minio-restore:
  weddingos-clamav:
  weddingos-prometheus:
  weddingos-alertmanager:
