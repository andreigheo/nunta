global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: weddingos-api
    metrics_path: /api/v1/internal/metrics
    authorization:
      type: Bearer
      credentials: staging-like-metrics-token
    static_configs:
      - targets: ["api:4000"]
    relabel_configs:
      - target_label: environment
        replacement: staging-like
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
