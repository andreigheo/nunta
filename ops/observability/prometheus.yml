global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:59093"]
scrape_configs:
  - job_name: weddingos-api
    metrics_path: /api/v1/internal/metrics
    authorization:
      type: Bearer
      credentials: weddingos-local-metrics-token-change-production
    static_configs:
      - targets: ["127.0.0.1:4000"]
    relabel_configs:
      - target_label: environment
        replacement: development
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:59092"]
