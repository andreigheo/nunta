pid /tmp/sarbato-storage-path-probe.pid;
error_log /tmp/sarbato-storage-path-probe.error.log;

events {}

http {
    access_log off;

    server {
        listen 127.0.0.1:43225;
        server_name sarbato.space;

        location ^~ /sarbato-production-private/ {
            client_max_body_size 1m;
            proxy_pass http://127.0.0.1:43223;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_request_buffering off;
        }
    }
}
